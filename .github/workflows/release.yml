name: Publish Package

# Green provenance check = publish from this workflow on a public repo.
#
# Preferred auth: Trusted Publisher (OIDC) — no NPM_TOKEN needed.
#   npmjs.com → tanstack-fetch → Settings → Trusted Publisher → GitHub Actions
#   Organization or user: mohamadgarmabi
#   Repository: tanstack-fetch
#   Workflow filename: release.yml
#   Allowed: npm publish
#
# Fallback: classic npm "Automation" token as secret NPM_TOKEN
#   (Granular / publish tokens that require OTP will fail with EOTP in CI)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # OIDC first (Trusted Publisher). Do NOT force --provenance:
      # trusted publishing enables it automatically for public repos.
      # NODE_AUTH_TOKEN is only a fallback if Trusted Publisher is not set.
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
