name: Publish Package

# Auth: npm Trusted Publisher only (OIDC). Do NOT set NPM_TOKEN.
# If NPM_TOKEN exists in GitHub Secrets, delete it — it causes EOTP.
#
# npmjs.com → Package → tanstack-fetch → Settings → Trusted Publisher
#   Publisher: GitHub Actions
#   Organization or user: mohamadgarmabi
#   Repository: tanstack-fetch
#   Workflow filename: release.yml   ← exact name, with .yml
#   Allowed actions: enable "npm publish"

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          # setup-node may write always-auth; that breaks OIDC publish
          npm config delete always-auth || true

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to npm via OIDC
        run: npm publish --access public --ignore-scripts
        # Intentionally no NODE_AUTH_TOKEN / NPM_TOKEN.
        # Provenance is attached automatically with Trusted Publishing.
