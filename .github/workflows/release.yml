name: Publish Package

# Green npm provenance check requires:
# 1) Public GitHub repo (mohamadgarmabi/tanstack-fetch)
# 2) permissions.id-token: write
# 3) npm publish --provenance from this workflow
# 4) package.json "repository.url" matching this repo
#
# Auth (pick one):
# A) GitHub secret NPM_TOKEN (classic — used below)
# B) npmjs.com → Package → Settings → Trusted Publisher
#    user: mohamadgarmabi | repo: tanstack-fetch | workflow: release.yml

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Ensure modern npm CLI
        run: |
          npm install -g npm@latest
          npm --version
          node --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance --ignore-scripts
        env:
          # Create at https://www.npmjs.com/settings/~/tokens (Automation token)
          # then: GitHub repo → Settings → Secrets → Actions → NPM_TOKEN
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
