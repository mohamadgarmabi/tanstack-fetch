name: Publish Package

# Requires Trusted Publisher on npmjs.com (Settings → Trusted Publisher):
#   Organization or user: mohamadgarmabi
#   Repository: tanstack-fetch
#   Workflow filename: release.yml
#   Allowed actions: ✔ npm publish   ← required (do not leave unchecked)
#
# Do NOT add NPM_TOKEN — empty _authToken from setup-node blocks OIDC.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Do NOT set registry-url here — it writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # which prevents OIDC trusted publishing when no token is set.
      # See: https://github.com/npm/documentation/issues/1960
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Ensure npm CLI supports OIDC (≥ 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version
          node --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "ACTIONS_ID_TOKEN_REQUEST_URL missing — id-token: write not effective"
            exit 1
          }

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Clear token placeholders that block OIDC
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
            sed -i '/always-auth/d' "$NPMRC"
            echo "Cleaned $NPMRC:"
            cat "$NPMRC" || true
          fi

      - name: Publish to npm via OIDC
        run: npm publish --access public --ignore-scripts
