name: Publish Package

# Requires Trusted Publisher on npmjs.com (Settings → Trusted Publisher):
#   Organization or user: mohamadgarmabi
#   Repository: tanstack-fetch
#   Workflow filename: release.yml
#   Allowed actions: ✔ npm publish   ← required (do not leave unchecked)
#
# Do NOT add NPM_TOKEN — empty _authToken from setup-node blocks OIDC.
#
# Publishes on every push to main when package.json version is new on npm.
# Bump the version in package.json before merging to main to release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Do NOT set registry-url here — it writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # which prevents OIDC trusted publishing when no token is set.
      # See: https://github.com/npm/documentation/issues/1960
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Ensure npm CLI supports OIDC (≥ 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version
          node --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "ACTIONS_ID_TOKEN_REQUEST_URL missing — id-token: write not effective"
            exit 1
          }

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Skip if version already published
        id: version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "Package: ${PACKAGE_NAME}@${PACKAGE_VERSION}"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${PACKAGE_VERSION} is already on npm — skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${PACKAGE_VERSION} is not on npm — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear token placeholders that block OIDC
        if: steps.version.outputs.should_publish == 'true'
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
            sed -i '/always-auth/d' "$NPMRC"
            echo "Cleaned $NPMRC:"
            cat "$NPMRC" || true
          fi

      - name: Publish to npm via OIDC
        if: steps.version.outputs.should_publish == 'true'
        run: npm publish --access public --ignore-scripts
