<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" style="--c: #4ade80" viewBox="-20 -20 400 240" role="img" aria-label="A server streams events to the client"><style>svg{--vp-font-family-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;--vp-font-family-base:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
/* ---------- SVG parts ---------- */

.blk-box {
  fill: #18181b;
  stroke: rgba(255, 255, 255, 0.14);
  stroke-width: 1;
}

.blk-code,
.blk-label {
  fill: #e4e4e7;
  font-family: var(--vp-font-family-mono);
  font-size: 11px;
}

.blk-label {
  font-family: var(--vp-font-family-base);
  font-size: 12.5px;
  font-weight: 600;
}

.blk-dim {
  fill: #a1a1aa;
}

.blk-good {
  fill: #4ade80;
}

.blk-bad {
  fill: #f87171;
}

.blk-line {
  fill: none;
  stroke: rgba(255, 255, 255, 0.16);
  stroke-width: 1.2;
  stroke-dasharray: 4 4;
}

/* A short dash that travels the path once per cycle (pathLength = 100). */
.blk-comet {
  fill: none;
  stroke: var(--c);
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 12 100;
  stroke-dashoffset: 12;
  filter: drop-shadow(0 0 4px var(--c));
  animation: blk-travel var(--dur, 4s) linear var(--delay, 0s) infinite;
}

.blk-fast {
  animation-name: blk-travel-full;
}

/* Lights up when its comet arrives (46% of the cycle). */
.blk-hit {
  animation: blk-hit var(--dur, 4s) ease var(--delay, 0s) infinite;
}

.blk-node {
  stroke: var(--c);
  stroke-opacity: 0.6;
}

.blk-ring {
  fill: none;
  stroke: var(--c);
  stroke-width: 2;
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: blk-pulse var(--dur, 5s) ease-out infinite;
}

.blk-swap-out {
  animation: blk-swap-out 5s ease infinite;
}

.blk-swap-in {
  opacity: 0;
  animation: blk-swap-in 5s ease infinite;
}

.blk-msg {
  opacity: 0;
  animation: blk-msg 4.5s ease var(--delay, 0s) infinite;
}

.blk-pip {
  fill: var(--c);
}

@keyframes blk-travel {
  0% {
    stroke-dashoffset: 12;
    opacity: 1;
  }
  45% {
    stroke-dashoffset: -100;
    opacity: 1;
  }
  46%,
  100% {
    stroke-dashoffset: -100;
    opacity: 0;
  }
}

@keyframes blk-travel-full {
  from {
    stroke-dashoffset: 12;
  }
  to {
    stroke-dashoffset: -100;
  }
}

@keyframes blk-hit {
  0%,
  40%,
  85%,
  100% {
    stroke: rgba(255, 255, 255, 0.14);
    fill: #18181b;
  }
  48%,
  70% {
    stroke: var(--hit, var(--c));
    fill: #221f24;
  }
}

@keyframes blk-pulse {
  0%,
  44% {
    opacity: 0;
    transform: scale(1);
  }
  50% {
    opacity: 0.8;
  }
  75%,
  100% {
    opacity: 0;
    transform: scale(1.45);
  }
}

@keyframes blk-swap-out {
  0%,
  52%,
  100% {
    opacity: 1;
  }
  58%,
  94% {
    opacity: 0;
  }
}

@keyframes blk-swap-in {
  0%,
  52%,
  100% {
    opacity: 0;
  }
  58%,
  94% {
    opacity: 1;
  }
}

@keyframes blk-msg {
  0% {
    opacity: 0;
    transform: translateX(-10px);
  }
  10%,
  80% {
    opacity: 1;
    transform: translateX(0);
  }
  92%,
  100% {
    opacity: 0;
    transform: translateX(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .blk-comet,
  .blk-ring,
  .blk-swap-out {
    opacity: 0;
  }
  .blk-msg,
  .blk-swap-in {
    opacity: 1;
  }
}
</style>
<defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.09)"/></pattern></defs>
<rect x="-20" y="-20" width="400" height="240" fill="#0e0e10"/><rect x="-20" y="-20" width="400" height="240" fill="url(#dots)"/><rect class="blk-box" x="14" y="72" width="92" height="56" rx="9"></rect><text class="blk-label" x="60" y="96" text-anchor="middle">server</text><text class="blk-code blk-dim" x="60" y="113" text-anchor="middle">SSE · WS</text><path class="blk-line" d="M106 100 L150 100"></path><path class="blk-comet blk-fast" pathLength="100" d="M106 100 L150 100" style="--dur:1.5s;"></path><g class="blk-msg" style="--delay: 0s"><rect class="blk-box" x="156" y="44" width="190" height="30" rx="7"></rect><circle class="blk-pip" cx="172" cy="59" r="3.5"></circle><text class="blk-code" x="184" y="63">{ status: &#39;paid&#39; }</text></g><g class="blk-msg" style="--delay: 1.5s"><rect class="blk-box" x="156" y="84" width="190" height="30" rx="7"></rect><circle class="blk-pip" cx="172" cy="99" r="3.5"></circle><text class="blk-code" x="184" y="103">{ text: &#39;hi&#39; }</text></g><g class="blk-msg" style="--delay: 3s"><rect class="blk-box" x="156" y="124" width="190" height="30" rx="7"></rect><circle class="blk-pip" cx="172" cy="139" r="3.5"></circle><text class="blk-code" x="184" y="143">{ progress: 64 }</text></g></svg>
